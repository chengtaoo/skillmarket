version: '3.8'

services:
  skillmarket:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MIRROR=registry.cn-shanghai.aliyuncs.com
    container_name: skillmarket
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=your-super-secret-key-change-in-production
      - PORT=3000
    volumes:
      - ./data:/app/server/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - skillmarket-network

networks:
  skillmarket-network:
    driver: bridge
