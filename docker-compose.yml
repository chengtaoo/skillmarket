version: '3.8'

services:
  skillmarket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillmarket
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=your-super-secret-key-change-in-production
      - PORT=3000
    volumes:
      # 持久化技能与用户数据；首次部署前可在项目根目录创建空目录 data/
      - ./data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - skillmarket-network

networks:
  skillmarket-network:
    driver: bridge
